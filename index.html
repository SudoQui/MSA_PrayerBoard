<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#204768" />
  <title>Prayer Board</title>
  <link rel="stylesheet" href="./resources/css/index.css" />
  <link rel="stylesheet" href="./resources/css/wallboard-hardening.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div id="UCMSA_logo" class="brand"><img src="./resources/images/MSA PNG.png" alt="UCMSA Logo" /></div>
      <div id="NextPrayer" class="NextPrayer" aria-live="polite">Loading prayer schedule…</div>
    </header>
    <main class="content">
      <h1 id="CurrentTime">--:--</h1>
      <div class="date"><h4 id="gregDate"></h4><h2 class="dotpoint">.</h2><h4 id="islamicDate"></h4></div>
      <section id="PrayerBoard" aria-label="Daily prayer times">
        <div class="header"><div></div><div>Adhan</div><div>Iqamah</div></div>
        <div id="Fajr" class="prayer"><div>Fajr</div><div id="FajrAdhan" class="adhan">--:--</div><div id="FajrIqamah" class="Iqamah">--:--</div></div>
        <div id="Dhuhr" class="prayer"><div>Dhuhr</div><div id="DhuhrAdhan" class="adhan">--:--</div><div id="DhuhrIqamah" class="Iqamah">--:--</div></div>
        <div id="Asr" class="prayer"><div>Asr</div><div id="AsrAdhan" class="adhan">--:--</div><div id="AsrIqamah" class="Iqamah">--:--</div></div>
        <div id="Maghrib" class="prayer"><div>Maghrib</div><div id="MaghribAdhan" class="adhan">--:--</div><div id="MaghribIqamah" class="Iqamah">--:--</div></div>
        <div id="Isha" class="prayer"><div>Isha</div><div id="IshaAdhan" class="adhan">--:--</div><div id="IshaIqamah" class="Iqamah">--:--</div></div>
      </section>
      <div id="boardStatus" class="boardStatus" role="status" aria-live="polite"></div>
    </main>
    <footer id="siteFooter">
      <div class="eventCard"><div class="qr"><img src="./resources/images/linktr.png" alt="QR Code" /></div><div class="eventDetails"><h3>WHAT’S GOING ON AT THE MSA:</h3><strong>MSA LinkTree</strong><p>Instagram</p><p>WhatsApp</p><p>Get your Membership</p></div></div>
      <div class="logo"><img src="./resources/images/logo1.png" alt="SudoLabs Logo" /><small>Powered by SudoLabs</small></div>
    </footer>
  </div>
  <script src="./resources/JS/config.js"></script>
  <script src="./resources/JS/app.js"></script>
</body>
</html>
